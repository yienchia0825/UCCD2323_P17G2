<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Us - Animation & Multimedia Club</title>

    <link rel="stylesheet" href="css/style(event).css">
</head>

<body>

    <header>
        <h1>Animation & Multimedia Club</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="animation.html">Animation</a>
        <a href="multimedia.html">Multimedia</a>
        <a href="tutorials.html">Tutorials</a>
        <a href="gallery.html">Gallery</a>
        <a href="event.html">Events</a>
        <a href="joinus.html">Join Us</a>
    </nav>


    <main>

        <h2>Join Us</h2>

        <p>
            Interested in animation and multimedia?
            Join our club and develop your creativity with us!
        </p>


        <form id="joinForm">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>


            <label for="studentID">Student ID:</label>
            <input type="text" id="studentID" name="studentID" placeholder="Enter your student ID" required>


            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>


            <label for="interest">Area of Interest:</label>

            <select id="interest" name="interest" required>

                <option value="">Select your interest</option>
                <option value="Animation">Animation</option>
                <option value="Video Editing">Video Editing</option>
                <option value="Multimedia Production">Multimedia Production</option>
                <option value="Graphic Design">Graphic Design</option>
                <option value="Photography">Photography</option>
                <option value="3D Modelling">3D Modelling</option>

            </select>


            <label for="reason">
                Why do you want to join us?
            </label>

            <textarea id="reason" name="reason" rows="5" placeholder="Tell us why you are interested"
                required></textarea>


            <button type="submit">Submit</button>

            <button type="reset">Reset</button>

        </form>

        <p id="message"></p>

    </main>


    <footer>
        <p>&copy; 2026 Animation & Multimedia Club</p>
    </footer>


    <script>

        var joinForm = document.getElementById("joinForm");

        joinForm.addEventListener("submit", function (event) {

            event.preventDefault();

            var name = document.getElementById("name").value;

	    var studentID = document.getElementById("studentID").value;

            var email = document.getElementById("email").value;

            var interest = document.getElementById("interest").value;

            var reason = document.getElementById("reason").value;

            var application = {

                name: name,

                studentID: studentID,

                email: email,

                interest: interest,

                reason: reason
            };

           // Store the application in Local Storage
            localStorage.setItem(
                "membershipApplication",
                JSON.stringify(application)
            );


            // Display confirmation message
            document.getElementById("message").innerHTML =
                "Thank you, " + name +
                "! Your membership application has been submitted.";


            // Clear the form
            joinForm.reset();

        });

    </script>

</body>

</html>
